spring.application.name=fitness-workout-tracker
spring.datasource.url=jdbc:postgresql://localhost:5432/workout_tracker
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

app.jwt.secret=change-this-to-a-long-random-secret-key-at-least-32-characters
app.jwt.expiration=3600
app.jwt.issuer=workout-tracker